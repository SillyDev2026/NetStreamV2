name: NetStream source audit

on:
  push:
  pull_request:

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic source and wire-layout checks
        run: node scripts/source-audit.mjs
